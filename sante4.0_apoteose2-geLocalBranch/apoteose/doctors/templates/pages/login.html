{% load static %}

<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Apotose - Login</title>

        <link rel="stylesheet" href="{% static 'css/style.css' %}">
        <link rel="shortcut icon" href="{% static 'img/prico.ico' %}">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        
    </head>
    
    <body>
        <div class="container">
            <div class="login-inst-logo">
                <img src="{% static 'img/ApoteoseLogoV2.svg' %}" alt="Apotose" class="logo-login">
            </div>
            
            <div class="login">
                <div class="form">
                    <div class="unitForm" id="usuario" >
                        <i class="bi bi-person"></i>
                        <input type="text" placeholder="Utilisateur" onfocus="changeActive('usuario')" onblur="changeActive('usuario')">
                    </div>
    
                    <div class="unitForm" id="senha" >
                        <i class="bi bi-key"></i>
                        <input type="password" placeholder="Mot de Passe" onfocus="changeActive('senha')" onblur="changeActive('senha')">
                    </div>
    
                    <div class="options">
                        <div class="login_links">
                            <a href="#">Mot de Passe Oublié</a>
                        </div>
                        <div class="login_links">
                            <a href="#">S'inscrire</a>
                        </div>
                        
                    </div>
    
                    
                </div>
                <div class="login-buttons">
                    <input type="button" class="main-btn" value="Se Connecter" onclick="document.location.href='/home/'"></input>

                </div>
            </div>

        </div>
       
        
        <script src="{% static 'js/script.js' %}"></script>

    </body>
</html>
